<!DOCTYPE html>
<html><head><base target="_top"><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
*{box-sizing:border-box}
body{font-family:"Hiragino Sans","Meiryo",sans-serif;margin:0;background:#f2f4f8;color:#222}
header{background:#1f3a7a;color:#fff;padding:10px 14px;display:flex;justify-content:space-between;align-items:center}
header a{color:#cfd8f5;font-size:13px;cursor:pointer;margin-left:10px}
nav{background:#fff;border-bottom:1px solid #ccc;display:flex;overflow-x:auto}
nav button{flex:none;background:none;border:0;border-bottom:3px solid transparent;padding:12px 14px;font-size:14px;cursor:pointer}
nav button.on{border-color:#1f3a7a;color:#1f3a7a;font-weight:bold}
main{padding:12px;max-width:1000px;margin:0 auto}.v{display:none}.v.on{display:block}
input,select{padding:8px;font-size:16px;max-width:100%}
.p{background:#1f3a7a;color:#fff;border:0;padding:9px 16px;border-radius:5px;cursor:pointer;font-size:14px}
.s{background:#fff;color:#1f3a7a;border:1px solid #1f3a7a}
#login{max-width:340px;margin:60px auto;background:#fff;padding:24px;border-radius:8px;box-shadow:0 1px 4px #0003}
#login input{width:100%;margin:6px 0 12px}#login .p{width:100%;padding:12px}.err{color:#c0392b;margin-top:8px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal div{background:#fff;border:1px solid #ccc;min-height:64px;padding:3px;font-size:12px}
.cal .h{min-height:0;background:#eee;text-align:center}.cal .d{cursor:pointer}.cal .d:hover{background:#eef3ff}.cal .t{border:2px solid #1f3a7a}
.u{color:#c0392b}.k{color:#27ae60}.big{font-size:15px;font-weight:bold}
.c{background:#fff;margin:8px 0;padding:12px;border-radius:8px;box-shadow:0 1px 3px #0003}
.c.done{opacity:.6;background:#e6f4ea}.g{font-size:12px;color:#666}.n{font-size:17px;font-weight:bold}
.b{display:inline-block;margin:6px 6px 0 0;padding:8px 12px;border-radius:6px;background:#eef3ff;color:#1f3a7a;text-decoration:none;font-size:14px}
.ok{width:100%;margin-top:10px;padding:14px;font-size:17px;border:0;border-radius:8px;background:#27ae60;color:#fff}
.un{width:100%;margin-top:10px;padding:9px;border:1px solid #999;border-radius:8px;background:#fff}
.tag{background:#ffe9b0;padding:1px 6px;border-radius:4px;font-size:12px;margin-right:4px}
table{border-collapse:collapse;width:100%;font-size:12px;background:#fff}th,td{border:1px solid #999;padding:4px;vertical-align:top}th{background:#eee}
.msg{margin:10px 0;white-space:pre-wrap}.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
@media print{header,nav,.noprint{display:none!important}main{padding:0;max-width:none}body{background:#fff}}
.sh{background:#fff;color:#000;border:1px solid #bbb;max-width:194mm;min-height:277mm;margin:0 auto 16px;padding:10mm;display:flex;flex-direction:column;font-size:13px;line-height:1.5;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sh .top{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid #ccc;padding-bottom:8px}
.sh .logo{height:24mm;width:auto}.sh .ttl{text-align:right;font-weight:700;font-size:14px}
.sh .mid{display:flex;flex-wrap:wrap;gap:12px;padding:10px 0;border-bottom:1px solid #ccc}.sh .l{width:27%;font-size:14px}.sh .r{flex:1;font-size:14px;font-weight:700}
.sh .qrs{display:flex;gap:20mm;width:100%;justify-content:flex-start;margin-top:8px}.sh .qrs div{text-align:center;font-size:11px;font-weight:700}.sh img.qr{width:32mm;height:32mm;image-rendering:pixelated;display:block;margin:0 auto 2px}
.sh table{width:100%;border-collapse:collapse;margin-top:8px;font-size:13px;background:#fff;color:#000}
.sh th,.sh td{border:0;padding:6px;text-align:left}.sh th{border-bottom:2px solid #000;background:none}.sh td{background:#f2f2f2;border-bottom:1px solid #ddd}.sh .c{text-align:center}
.sh .mu2{margin-top:10px;font-size:12px}.sh .box{border:1px solid #bbb;border-radius:4px;min-height:22mm;padding:6px;margin:4px 0 6px}
.sh .note{font-size:11px;font-weight:700;text-align:center;margin:4px 0}.sh .ret{font-size:18px;font-weight:700;text-align:center;margin:10px 0}
.sh .bot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:6px}.sh .rt{font-size:30px;font-weight:700}
.sh .cut{border-top:2px dashed #666;margin-top:auto;padding-top:8px;font-size:11px}.sh .slip{display:inline-block;border:1px solid #000;padding:3px 14px;font-weight:700;margin-bottom:6px}
.sh .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.sh .dt{background:#f2f2f2;padding:6px;text-align:center;margin:6px 0}.sh .on{font-size:16px;font-weight:700;text-align:center}
.sh .sup{border:1px solid #bbb;padding:6px;font-size:11px}.sh p{margin:4px 0}
@media print{@page{size:A4;margin:10mm}.sh{border:0;margin:0;max-width:none;min-height:272mm;padding:0;page-break-after:always;break-after:page}.sh:last-child{page-break-after:auto;break-after:auto}}
.tw{overflow-x:auto}.stg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.stb{padding:20px 8px;font-size:19px;font-weight:700;border-radius:8px;border:0;cursor:pointer;color:#fff}.sok{background:#2a7448}.sng{background:#b64d08}
#rep label{display:block;margin:12px 0;font-size:13px}#rep input,#rep textarea{width:100%;padding:10px;font-size:16px;margin-top:4px;border:1px solid #bbb;border-radius:6px;font-family:inherit}
#rep .stb.dim{opacity:.35}.ph{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.ph div{position:relative}.ph img{width:84px;height:84px;object-fit:cover;border-radius:6px}.ph b{position:absolute;top:0;right:0;background:#000b;color:#fff;border-radius:50%;width:24px;height:24px;text-align:center;cursor:pointer}
#rep select{width:100%;padding:10px;font-size:16px;margin-top:4px;border:1px solid #bbb;border-radius:6px;font-family:inherit}
.slot{border:1px dashed #999;border-radius:8px;padding:8px 10px;margin:10px 0;font-size:13px}.slot input{margin-top:6px}
</style></head><body>

<!-- ログイン -->
<div id="login">
 <h2 style="margin-top:0">配送受注システム</h2>
 メールアドレス<input type="email" id="lE" autocomplete="username">
 パスワード<input type="password" id="lP" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
 <button class="p" onclick="doLogin()" id="lB">ログイン</button><div class="err" id="lErr"></div>
</div>

<div id="rep" hidden>
 <header><b>配送報告</b><span class="g" id="rId" style="color:#cfd8f5"></span></header>
 <main>
  <div id="rCard">読込中…</div>
  <h3>ステータスを選ぶ</h3><div class="stg" id="rSt"></div>
  <div id="rRcW" hidden><label>受取人<select id="rRc"><option value="">選択してください</option><option>本人</option><option>代理人</option><option>その他</option></select></label></div>
  <div id="rCrW" hidden><label>運送会社<input id="rCr" list="rCrList" placeholder="例: ヤマト運輸"><datalist id="rCrList"><option value="ヤマト運輸"><option value="佐川急便"><option value="日本郵便"><option value="西濃運輸"><option value="福山通運"></datalist></label></div>
  <div id="rSlots"></div>
  <label>メモ<textarea id="rMemo" rows="3" placeholder="置き配の場所、不在時の状況など"></textarea></label>
  <button class="ok" id="rGo" onclick="repSend()">報告する</button><div class="msg" id="rMsg"></div>
 </main>
</div>
<div id="app" style="display:none">
<header><b>配送受注システム</b><span><span id="uName"></span><a onclick="logout()">ログアウト</a></span></header>
<nav id="menu">
 <button data-v="cal" class="on">受注一覧</button><button data-v="cf">確定受注データ</button>
 <button data-v="imp">配送データ取込</button>
 <button data-v="prt">配送指示書印刷</button>
 <button data-v="srch">配送検索</button>
 <button data-v="bil" data-adm>請求書</button>
</nav>
<main>

<!-- メイン: カレンダー -->
<div class="v on" id="cal">
 <div class="bar"><button class="p s" onclick="mv(-1)">＜</button><span class="big" id="ym"></span><button class="p s" onclick="mv(1)">＞</button><button class="p s" onclick="drawCal()">更新</button></div>
 <div class="bar"><button class="p s" data-adm onclick="runConfirmNow()">確定処理を今すぐ実行</button><span class="mu g" id="fcM"></span></div>
 <div class="cal" id="calGrid"></div>
 <p class="g"><span class="u">■未完了</span> <span class="k">■完了</span>　予定=予定データの件数 / 確定=確定データの件数(未=未完了、済=完了)。日付を押すと配送一覧を表示します</p>
</div>

<!-- 配送一覧 -->
<div class="v" id="lst">
 <div class="bar"><button class="p s" onclick="show('cal')">＜ 受注一覧</button><span class="big" id="lDate"></span><span id="lSum" class="g"></span>
  <button class="p s" onclick="goPrint(curDate)">この日の指示書を印刷</button></div>
 <label class="g"><input type="checkbox" id="hide" onchange="drawList()"> 完了を隠す</label>
 <div id="lOut"></div>
</div>

<!-- 配送データ取込 -->
<div class="v" id="imp">
 <h3>配送データ取込(CSV)</h3>
 <input type="file" id="file" accept=".csv"> <button class="p" onclick="doImport()">取込実行</button>
 <div class="msg" id="impMsg"></div>
 <p class="g">UTF-8 / Shift_JIS 自動判定。配送ID+商品IDが同じ行は重複としてスキップします。</p>
</div>

<!-- 配送指示書印刷 -->
<div class="v" id="prt">
 <div class="bar noprint"><b>配送指示書</b><input type="date" id="pDate"><button class="p" onclick="loadPrint()">表示</button><button class="p s" onclick="window.print()">印刷</button></div>
 <div id="pOut"></div>
</div>

<!-- 配送検索 -->
<div class="v" id="srch">
 <h3>配送検索</h3>
 <div class="bar"><select id="sType"><option value="id">配送番号</option><option value="tel">電話番号</option></select>
  <input id="sQ" placeholder="検索キーワード" onkeydown="if(event.key==='Enter')doSearch()"><button class="p" onclick="doSearch()">検索</button></div>
 <div class="g" id="sSum"></div><div id="sOut"></div>
</div>

<!-- 請求明細 -->
<div class="v" id="bil">
 <h2>請求書作成</h2>
 <div class="bar">配送日 <input type="date" id="bF"> 〜 <input type="date" id="bT"> 請求先 <input id="bTo" value="GOKUMIN" size="14"><button class="p" onclick="doBill()">作成</button></div>
 <div class="msg" id="bMsg"></div><div class="tw" id="bOut"></div>
 <p class="mu g">確定データの「配送完了」の配送を期間で集計し、請求書と明細を1つのスプレッドシートとして、指定のフォルダに作成します。</p>
</div>
<div class="v" id="cf">
 <h2>確定受注データ</h2>
 <div class="bar"><input type="date" id="cfF"><span>〜</span><input type="date" id="cfT">
  <select id="cfSt"><option value="">全ステータス</option><option>未配送</option><option>配送完了</option><option>不在</option><option>持ち戻り</option><option>搬入不可</option><option>その他</option></select>
  <input id="cfK" placeholder="顧客名・住所・配送ID" onkeydown="if(event.key==='Enter')loadRange('cf')"><button class="p" onclick="loadRange('cf')">表示</button></div>
 <div class="mu g" id="cfS"></div><div class="tw" id="cfO"></div>
</div>
<div class="v" id="sts">
 <div class="bar"><button class="p s" onclick="show('cal')">＜ 受注一覧</button></div>
 <div id="stO"></div>
</div>
</main></div>

<script>
const $=id=>document.getElementById(id), pad=n=>('0'+n).slice(-2);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
let T=null,U=null,curDate='',dayData=[],srchData=[],srchMode=false;

/* サーバー呼び出し(トークン自動付与・期限切れは再ログイン) */
function run(fn,...a){return new Promise((ok,ng)=>google.script.run.withSuccessHandler(ok)
 .withFailureHandler(e=>{if(/セッション/.test(e.message)){logout(true);}ng(e)})[fn](T,...a))}

/* ログイン */
function doLogin(){$('lB').disabled=true;$('lErr').textContent='';
 google.script.run.withSuccessHandler(r=>{$('lB').disabled=false;
  if(!r){$('lErr').textContent='メールアドレスまたはパスワードが違います';return}
  T=r.token;U=r;$('login').style.display='none';$('app').style.display='block';$('uName').textContent=r.name+'('+r.role+')';
  document.querySelectorAll('[data-adm]').forEach(e=>e.style.display=r.role==='管理者'?'':'none');
  $('pDate').value=todayStr();initRange();run('getAppUrl').then(u=>APP_URL=u);INIT_ID?openStatus(INIT_ID):show('cal');
 }).withFailureHandler(e=>{$('lB').disabled=false;$('lErr').textContent='エラー: '+e.message}).login($('lE').value,$('lP').value);}
function logout(expired){T=null;U=null;$('app').style.display='none';$('login').style.display='block';$('lP').value='';
 $('lErr').textContent=expired?'セッションが切れました。再ログインしてください':'';}

/* 画面切替 */
function show(v){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v||(v==='lst'&&b.dataset.v==='cal')));
 document.querySelectorAll('.v').forEach(x=>x.classList.toggle('on',x.id===v));
 if(v==='cal')drawCal(); if(v==='bil')initBill();}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>show(b.dataset.v));

/* カレンダー */
let cur=new Date();cur.setDate(1);
function mv(n){cur.setMonth(cur.getMonth()+n);drawCal()}
function drawCal(){const y=cur.getFullYear(),m=cur.getMonth()+1;$('ym').textContent=y+'年'+m+'月';
 run('getCounts',y+'-'+pad(m)).then(c=>{
  let h=['日','月','火','水','木','金','土'].map(x=>'<div class="h">'+x+'</div>').join('');
  const first=new Date(y,m-1,1).getDay(),days=new Date(y,m,0).getDate();
  for(let i=0;i<first;i++)h+='<div style="background:none;border:0"></div>';
  for(let d=1;d<=days;d++){const k=y+'-'+pad(m)+'-'+pad(d),v=c[k];
   h+='<div class="d'+(k===todayStr()?' t':'')+'" onclick="openDay(\''+k+'\')"><b>'+d+'</b>'+(v?'<br><span class="g">予定'+(v.plan||0)+'件</span><br><span class="big">確定'+v.total+'件</span>'+(v.total?'<br><span class="u">未'+(v.total-v.done-(v.absent||0))+'</span> <span class="k">済'+v.done+'</span>'+(v.absent?' <span class="u">不在'+v.absent+'</span>':''):''):'')+'</div>';}
  $('calGrid').innerHTML=h;}).catch(e=>alert(e.message));}

/* 配送一覧 */
function openDay(d){curDate=d;show('lst');$('lDate').textContent=d;$('lOut').textContent='読込中…';planHtml='';
 run('getDeliveries',d).then(l=>{dayData=l;drawList();return run('getForecast',d,d)}).then(p=>{planHtml=planBlock(p.filter(g=>!g['転記日時']).map(NM));drawList()}).catch(e=>alert(e.message));}
function drawList(){const done=dayData.filter(g=>g['配送ステータス']==='配送完了').length;
 const ab=dayData.filter(g=>g['配送ステータス']==='不在').length;$('lSum').textContent='全'+dayData.length+'件 / 残り'+(dayData.length-done-ab)+'件 / 不在'+ab+'件';
 const l=dayData.filter(g=>!($('hide').checked&&g['配送ステータス']==='配送完了'));
 $('lOut').innerHTML=(l.length?l.map(g=>card(g,false,dayData.indexOf(g))).join(''):'<p class="g">この日の確定データはありません</p>')+planHtml;}
function card(g,showDate,i){const ok=g['配送ステータス']==='配送完了',src=showDate?'s':'d';
 return '<div class="c'+(ok?' done':'')+'"><div class="g">'+(showDate?esc(g['配送日'])+' ':'')+esc(g['時間カテゴリ'])+' '+esc(g['指定時間枠'])+' / 配送ID '+esc(g['配送ID'])+'</div>'+
 '<div class="n">'+esc(g['顧客名'])+'</div><div>'+esc(g['住所'])+'</div><div>'+esc(g['品名'])+'（'+g['個口数']+'口）</div>'+
 (g['組立設置']?'<span class="tag">組立設置</span>':'')+(g['引取']?'<span class="tag">引取</span>':'')+(g['配送ステータス']==='不在'?'<span class="tag" style="background:#ffd0c2">不在</span>':'')+
 (g['備考']?'<div class="g">備考: '+esc(g['備考'])+'</div>':'')+
 '<a class="b" href="tel:'+esc(g['連絡先'])+'">📞 '+esc(g['連絡先'])+'</a><a class="b" target="_blank" href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(g['住所'])+'">📍 地図</a>'+
 (ok?'<div class="g">完了 '+esc(g['配送完了時間'])+(g['完了メモ']?' / '+esc(g['完了メモ']):'')+'</div><button class="un" onclick="fin(\''+src+'\','+i+',true)">完了を取消</button>'
    :'<button class="ok" onclick="fin(\''+src+'\','+i+',false)">配送完了</button>')+'</div>';}
function fin(src,i,undo){const g=(src==='s'?srchData:dayData)[i];let memo='';
 if(undo){if(!confirm('完了を取り消しますか?'))return}
 else{memo=prompt('メモ(受取人名など・任意)','');if(memo===null)return}
 run('completeDelivery',g['配送ID'],g['配送日'],memo,undo).then(()=>src==='s'?doSearch():openDay(g['配送日'])).catch(e=>alert(e.message));}

/* CSV取込 */
function parseCSV(t){const rows=[];let r=[],f='',q=false;
 for(let i=0;i<t.length;i++){const c=t[i];
  if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}
  else if(c=='"')q=true;else if(c==',')(r.push(f),f='');
  else if(c=='\n'||c=='\r'){if(c=='\r'&&t[i+1]=='\n')i++;r.push(f);rows.push(r);r=[];f=''}else f+=c}
 if(f!==''||r.length){r.push(f);rows.push(r)}return rows.filter(x=>x.some(v=>v!==''));}
const norm=s=>s.replace(/[\s\u3000]/g,'').replace(/（/g,'(').replace(/）/g,')').replace(/^配送ステータス.*/,'配送ステータス');
async function doImport(){const f=$('file').files[0];if(!f){alert('CSVを選択してください');return}
 const buf=await f.arrayBuffer();let t=new TextDecoder('utf-8').decode(buf).replace(/^\uFEFF/,'');
 if(!t.includes('配送'))t=new TextDecoder('shift_jis').decode(buf);
 const rows=parseCSV(t),head=rows.shift().map(norm);
 if(!head.includes('配送ID')){$('impMsg').textContent='列名が不正です(配送IDがありません)';return}
 const data=rows.map(r=>{const o={};head.forEach((h,i)=>o[h]=(r[i]||'').trim());return o});
 $('impMsg').textContent='取込中… '+data.length+'行';
 run('importRows',data).then(r=>$('impMsg').textContent='追加: '+r.added+'行(予定データへ) / 重複スキップ: '+r.duplicated+'行'+(r.confirmed?'\n締め日時を過ぎた'+r.confirmed+'件を確定データへ転記しました':'')+(r.errors.length?'\nエラー:\n'+r.errors.join('\n'):''))
  .catch(e=>$('impMsg').textContent='失敗: '+e.message);}

/* 指示書 */

 '<div class="mid"><div class="l"><b>配送日：'+dm+'</b><br><b>配送時間：'+esc(g.slot)+'</b><br><u>'+esc(g.cat)+'</u></div>'+

 '<div class="qrs"><div><img class="qr" data-v="'+esc(tel)+'" alt=""><span>電話をかける</span></div><div><img class="qr" data-v="'+esc(map)+'" alt=""><span>住所を地図で表示</span></div><div><img class="qr" data-v="'+esc(statusUrl(g.id,g.k,g.date))+'" alt=""><span>配送結果を入力<br>(完了・不在など)</span></div></div></div>'+

 '<div class="mu2">作業指示</div><div class="box">'+esc(g.memo)+'</div>'+

function renderCodes(root){
 root.querySelectorAll('svg.bc').forEach(e=>{try{JsBarcode(e,e.dataset.v,{format:'CODE128',height:38,fontSize:12,margin:0,displayValue:true})}catch(x){e.outerHTML='<span>'+esc(e.dataset.v)+'</span>'}});
 root.querySelectorAll('img.qr').forEach(e=>{try{const q=qrcode(0,'M');q.addData(e.dataset.v);q.make();e.src=q.createDataURL(6,12)}catch(x){}});
}
function loadPrint(){const d=$('pDate').value;if(!d)return;$('pOut').textContent='読込中…';
 run('getDeliveries',d).then(l=>{if(!l.length){$('pOut').textContent='確定データに該当する配送がありません(締め日時前の日付は、確定後に印刷できます)';return}
  $('pOut').innerHTML=l.map((g,i)=>sheetHTML({id:g['配送ID'],date:g['配送日'],slot:g['指定時間枠']||g['時間カテゴリ'],cat:g['配送カテゴリ'],cust:g['顧客名'],addr:g['住所'],tel:g['連絡先'],memo:g['備考'],items:g.items,k:g['k']},i)).join('');
  renderCodes($('pOut'));}).catch(e=>$('pOut').textContent=e.message);}
/* ===== 受注予想 / 確定受注データ / ステータス入力(スマホ) ===== */
const STS=['配送完了','不在','持ち戻り','搬入不可','その他'];
const RCOL=[['date','配送日'],['slot','時間枠'],['id','配送ID'],['cust','顧客名'],['addr','住所'],['tel','連絡先'],['item','品名'],['box','口数'],['status','ステータス']];
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
function initRange(){const t=new Date(),m1=new Date(t.getFullYear(),t.getMonth(),1),m2=new Date(t.getFullYear(),t.getMonth()+1,0),p30=new Date(t.getFullYear(),t.getMonth(),t.getDate()+30);
 const def={cf:[m1,m2]};  // 確定受注データ: 今月
 Object.keys(def).forEach(k=>{if(!$(k+'F').value)$(k+'F').value=ymd(def[k][0]);if(!$(k+'T').value)$(k+'T').value=ymd(def[k][1])})}
let planHtml='';
const planBlock=l=>l.length?'<h3 class="g" style="grid-column:1/-1">予定データ(締め日時前・未確定) '+l.length+'件</h3>'+l.map(g=>'<div class="c" style="border-left-color:#888"><div class="g">予定 '+esc(g.slot)+' / 配送ID '+esc(g.id)+'</div><div class="n">'+esc(g.cust)+'</div><div>'+esc(g.addr)+'</div><div>'+esc(g.item)+'('+g.box+'口)</div></div>').join(''):'';
function loadRange(k){const A=$(k+'F').value,B=$(k+'T').value;if(!A||!B)return;$(k+'S').textContent='読込中…';$(k+'O').innerHTML='';
 fetchRange(k,A,B,k==='cf'?$('cfSt').value:'',k==='cf'?$('cfK').value.trim():'').then(rows=>{
  const cnt={};rows.forEach(r=>cnt[r.date]=(cnt[r.date]||0)+1);
  $(k+'S').innerHTML='全'+rows.length+'件'+(rows.length>=1000?'(先頭1000件のみ)':'')+'<br>'+Object.keys(cnt).sort().map(d=>d.slice(5).replace('-','/')+':'+cnt[d]+'件').join(' / ');
  $(k+'O').innerHTML=rows.length?'<table><tr>'+RCOL.map(c=>'<th>'+c[1]+'</th>').join('')+'</tr>'+rows.map(r=>'<tr>'+RCOL.map(c=>'<td>'+esc(r[c[0]])+'</td>').join('')+'</tr>').join('')+'</table>':'<p class="mu g">該当するデータはありません</p>';
 }).catch(e=>$(k+'S').textContent=e.message);}
function openStatus(id){show('sts');$('stO').textContent='読込中…';fetchOne(id).then(g=>drawStatus(g,id)).catch(e=>$('stO').textContent=e.message);}

 stDate=g.date;const q=esc(id);
 $('stO').innerHTML='<div class="c'+(g.status==='配送完了'?' done':'')+'"><div class="mu g">'+esc(g.date)+' '+esc(g.slot)+' / 配送ID '+q+'</div><div class="n">'+esc(g.cust)+'</div><div>'+esc(g.addr)+'</div><div>'+esc(g.item)+'('+g.box+'口)</div>'+
 '<a class="b" href="tel:'+esc(g.tel)+'">'+esc(g.tel)+' に発信</a><a class="b" target="_blank" href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(g.addr)+'">地図を開く</a>'+
 '<p>現在のステータス: <b>'+esc(g.status)+'</b>'+(g.time?'(' +esc(g.time)+')':'')+(g.memo?'<br>メモ: '+esc(g.memo):'')+'</p></div>'+
 '<div class="stg">'+STS.map(s=>'<button class="stb '+(s==='配送完了'?'sok':'sng')+'" onclick="saveSt(\''+q+'\',\''+s+'\')">'+s+'</button>').join('')+'</div>'+
 '<button class="un" onclick="saveSt(\''+q+'\',\'未配送\')">未配送に戻す</button>';}
function saveSt(id,s){const m=s==='未配送'?'':prompt(s+'のメモ(受取人名・不在票投函など・任意)','');if(m===null)return;
 storeSt(id,s,m).then(()=>openStatus(id)).catch(e=>alert(e.message));}
/* ---- 連携版: サーバー接続部 ---- */
const INIT_ID=<?!= JSON.stringify(String(initId)).replace(/</g,'\\u003c') ?>;
let APP_URL='';const statusUrl=(id,k,d)=>APP_URL+'?id='+encodeURIComponent(id)+(d?'&d='+d:'')+(k?'&k='+k:'');
const NM=g=>({date:g['配送日'],slot:g['指定時間枠']||g['時間カテゴリ'],id:g['配送ID'],cust:g['顧客名'],addr:g['住所'],tel:g['連絡先'],item:g['品名'],box:g['個口数'],status:g['配送ステータス']||'',time:g['配送完了時間'],memo:g['完了メモ']});
function fetchRange(k,A,B,st,kw){return k==='fc'?run('getForecast',A,B).then(l=>l.map(g=>Object.assign(NM(g),{status:g['転記日時']?'確定済':'予定'}))):run('getConfirmed',A,B,st,kw).then(l=>l.map(NM))}
function runConfirmNow(){$('fcM').textContent='実行中…';run('runConfirm').then(n=>{$('fcM').textContent=n+'件を確定データへ転記しました';drawCal()}).catch(e=>$('fcM').textContent=e.message)}

function fetchOne(id){return run('getDelivery',id,'').then(g=>g?NM(g):null)}
let stDate='';
function storeSt(id,s,m){return run('setStatus',id,stDate,s,m)}

/* ===== ドライバー報告(指示書のQR・その配送のみ) ===== */
// 配送完了=受領書の写真+受取人 / 不在・持ち戻り=不在票投函+発信履歴のスクショ(いずれも必須)
const SLOTS={'配送完了':[['receipt','受領書の写真',1]],'不在':[['notice','不在票投函の写真',1],['call','発信履歴のスクショ',1]],'持ち戻り':[['notice','不在票投函の写真',1],['call','発信履歴のスクショ',1]],'搬入不可':[['other','写真(任意)',0]],'その他':[['other','写真(任意)',0]]};
let repSel='',repPh={};
function repInit(){$('login').hidden=true;$('app').hidden=true;$('rep').hidden=false;
 $('rId').textContent='　配送ID '+INIT_ID;
 $('rSt').innerHTML=STS.map(s=>'<button class="stb '+(s==='配送完了'?'sok':'sng')+'" data-s="'+s+'" onclick="repPick(\''+s+'\')">'+s+'</button>').join('');repLoad();}
function repLoad(){repFetch().then(repDraw).catch(e=>$('rCard').innerHTML='<p style="color:#c0392b">'+esc(e.message)+'</p>')}
function repDraw(g){$('rCard').innerHTML='<div class="c'+(g.status==='配送完了'?' done':'')+'"><div class="mu g">'+esc(g.date)+' '+esc(g.slot)+' / '+esc(g.cat)+'</div><div class="n">'+esc(g.cust)+' 様</div><div>'+esc(g.addr)+'</div><div>'+esc(g.item)+'('+g.box+'口)</div>'+
 (g.note?'<div class="g">備考: '+esc(g.note)+'</div>':'')+
 '<a class="b" href="tel:'+esc(g.tel)+'">'+esc(g.tel)+' に発信</a><a class="b" target="_blank" href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(g.addr)+'">地図を開く</a>'+
 '<p>現在のステータス: <b>'+esc(g.status)+'</b>'+(g.time?'('+esc(g.time)+')':'')+(g.recipient?'<br>受取人: '+esc(g.recipient):'')+'</p></div>';}
function repPick(s){repSel=s;document.querySelectorAll('#rSt .stb').forEach(b=>b.classList.toggle('dim',b.dataset.s!==s));$('rRcW').hidden=s!=='配送完了';$('rCrW').hidden=!(s==='不在'||s==='持ち戻り');drawSlots()}
function drawSlots(){$('rSlots').innerHTML=(SLOTS[repSel]||[]).map(([k,l,req])=>'<div class="slot"><b>'+l+(req?' <span style="color:#c0392b;font-size:12px">必須</span>':'')+'</b><input type="file" accept="image/*" multiple onchange="addPhotos(\''+k+'\',this)"><div class="ph" id="ph_'+k+'">'+phHTML(k)+'</div></div>').join('')}
function phHTML(k){return (repPh[k]||[]).map((b,i)=>'<div><img src="data:image/jpeg;base64,'+b+'" alt=""><b onclick="repPh[\''+k+'\'].splice('+i+',1);$(\'ph_'+k+'\').innerHTML=phHTML(\''+k+'\')">×</b></div>').join('')}
function shrink(f){return new Promise(ok=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,1280/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.7).split(',')[1])};im.onerror=()=>ok(null);im.src=r.result};r.readAsDataURL(f)})}
async function addPhotos(k,inp){repPh[k]=repPh[k]||[];for(const f of [...inp.files]){if(repPh[k].length>=3){$('rMsg').textContent='写真は1項目3枚までです';break}const b=await shrink(f);if(b)repPh[k].push(b)}inp.value='';$('ph_'+k).innerHTML=phHTML(k)}
function repSend(){if(!repSel){$('rMsg').textContent='ステータスを選んでください';return}
 const sl=SLOTS[repSel]||[];
 for(const [k,l,req] of sl){if(req&&!(repPh[k]||[]).length){$('rMsg').textContent=l+'を添付してください';return}}
 if(repSel==='配送完了'&&!$('rRc').value){$('rMsg').textContent='受取人を選んでください';return}
 const cr=$('rCr').value.trim();if((repSel==='不在'||repSel==='持ち戻り')&&!cr){$('rMsg').textContent='運送会社を入力してください';return}
 const photos=[];sl.forEach(([k])=>(repPh[k]||[]).forEach(b=>photos.push({slot:k,data:b})));
 $('rGo').disabled=true;$('rMsg').textContent='送信中…(写真があると時間がかかります)';
 repSave(repSel,repSel==='配送完了'?$('rRc').value:'',$('rMemo').value.trim(),photos,cr).then(r=>{
  $('rMsg').textContent='報告しました'+(r&&r.slack==='error'?'(Slackへの送信に失敗しました。管理者に連絡してください)':r&&r.slack==='sent'?'(Slackにも報告しました)':'');
  sl.forEach(([k])=>repPh[k]=[]);drawSlots();$('rGo').disabled=false;repLoad()})
  .catch(e=>{$('rMsg').textContent='失敗: '+e.message;$('rGo').disabled=false});}
/* ---- 連携版: 報告の接続部 ---- */
const INIT_D=<?!= JSON.stringify(String(initD)).replace(/</g,'\\u003c') ?>;
const INIT_K=<?!= JSON.stringify(String(initK)).replace(/</g,'\\u003c') ?>;
const repNM=g=>({date:g['配送日'],slot:g['指定時間枠']||g['時間カテゴリ'],cat:g['配送カテゴリ'],cust:g['顧客名'],addr:g['住所'],tel:g['連絡先'],item:g['品名'],box:g['個口数'],status:g['配送ステータス']||'',time:g['配送完了時間'],recipient:g['受取人名'],note:g['備考']});
function repFetch(){return new Promise((ok,ng)=>google.script.run.withSuccessHandler(g=>ok(repNM(g))).withFailureHandler(ng).reportGet(INIT_ID,INIT_D,INIT_K))}
function repSave(s,rc,memo,ph,cr){return new Promise((ok,ng)=>google.script.run.withSuccessHandler(ok).withFailureHandler(ng).reportSubmit(INIT_ID,INIT_D,INIT_K,s,rc,memo,ph,cr))}

/* 検索 */
function doSearch(){const q=$('sQ').value.trim();if(!q)return;$('sSum').textContent='検索中…';
 run('searchDeliveries',$('sType').value,q).then(l=>{srchData=l;
  $('sSum').textContent=l.length+'件'+(l.length>=100?'(先頭100件のみ表示)':'');
  $('sOut').innerHTML=l.map((g,i)=>card(g,true,i)).join('');}).catch(e=>$('sSum').textContent=e.message);}

/* 請求書 */
function initBill(){if(!$('bF').value){const t=new Date();$('bF').value=ymd(new Date(t.getFullYear(),t.getMonth(),1));$('bT').value=ymd(t)}}
function doBill(){const F=$('bF').value,T=$('bT').value,to=$('bTo').value.trim();
 if(!F||!T||!to){$('bMsg').textContent='期間と請求先を入力してください';return}
 $('bMsg').textContent='作成中…';$('bOut').innerHTML='';
 run('makeInvoice',F,T,to).then(r=>{
  $('bMsg').innerHTML='配送 '+r.rows.length+'件 / 小計 '+r.subtotal.toLocaleString()+'円 / 消費税 '+r.tax.toLocaleString()+'円 / <b>合計 '+r.total.toLocaleString()+'円</b>(税込)<br><a href="'+r.url+'" target="_blank">請求書・明細を開く（'+esc(r.name)+'）</a>';
  $('bOut').innerHTML='<table><tr>'+r.head.map(h=>'<th>'+h+'</th>').join('')+'</tr>'+r.rows.map(x=>'<tr>'+x.map(v=>'<td>'+esc(typeof v==='number'?v.toLocaleString():v)+'</td>').join('')+'</tr>').join('')+'</table>';
 }).catch(e=>$('bMsg').textContent=e.message);}
if(INIT_ID&&INIT_K)repInit();
</script></body></html>
